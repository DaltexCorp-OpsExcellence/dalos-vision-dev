<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0ede6;--bg2:#e8e4da;--bg3:#ddd8cc;
  --sidebar:#1e2d22;--sidebar2:#263529;
  --sidebar-text:#c8d4c0;--sidebar-muted:#6a8068;
  --accent:#2b5c3f;--accent2:#4a8c62;
  --amber:#b87820;--amber-bg:#fdf3e0;--amber-border:#e8c87a;
  --red:#b03030;--red-bg:#faeaea;--red-border:#e8a0a0;
  --green:#1e6b3a;--green-bg:#e8f5ec;--green-border:#8ecba4;
  --text:#1a1a17;--text2:#4a4840;--text3:#7a7668;
  --border:#d0cbbe;--border2:#bcb8ae;--card:#ffffff;
  --font-display:'DM Serif Display',serif;
  --font-body:'Instrument Sans',sans-serif;
  --font-mono:'DM Mono',monospace;
  --r:8px;--r2:12px;
  --sidebar-w:218px;
}
html,body,#root{height:100%;font-family:var(--font-body);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
button{font-family:var(--font-body);cursor:pointer;border:none;background:none}
input,select,textarea{font-family:var(--font-body);font-size:13px;color:var(--text)}

/* LANDING */
.landing{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:0 24px;overflow-y:auto}
.landing-logo{font-family:var(--font-display);font-size:32px;color:var(--text)}
.landing-sub{font-size:12px;color:var(--text3);margin-top:5px;letter-spacing:.06em;text-transform:uppercase}
.landing-prompt{font-size:15px;color:var(--text2);margin-top:30px;margin-bottom:32px}
.crop-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,200px));gap:14px;justify-content:center}
.crop-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px 16px 16px;cursor:pointer;transition:transform .18s,box-shadow .18s,border-color .18s}
.landing-crop-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
/* Landing — glass + stepped line → packhouse → product (2026-10) */
.layout.lg-layout{background:
  radial-gradient(60% 45% at 12% 8%,rgba(142,203,164,.50),transparent 70%),
  radial-gradient(50% 40% at 88% 14%,rgba(220,199,156,.50),transparent 70%),
  radial-gradient(55% 45% at 72% 92%,rgba(160,180,232,.35),transparent 70%),
  radial-gradient(45% 40% at 18% 86%,rgba(232,200,122,.30),transparent 70%),
  linear-gradient(160deg,#eef2ea,#f3eee4 55%,#ece9f1)}
.lg-layout .main,.landing.lg-glass{background:transparent}
/* Glass Home (2026-10-11): the Vision Home in light glass on the same background as every page. Off: ?home=dark */
.dh-page.vgh{background:
  radial-gradient(60% 45% at 12% 8%,rgba(142,203,164,.50),transparent 70%),
  radial-gradient(50% 40% at 88% 14%,rgba(220,199,156,.50),transparent 70%),
  radial-gradient(55% 45% at 72% 92%,rgba(160,180,232,.35),transparent 70%),
  radial-gradient(45% 40% at 18% 86%,rgba(232,200,122,.30),transparent 70%),
  linear-gradient(160deg,#eef2ea,#f3eee4 55%,#ece9f1)!important}
.dh-page.vgh .dh-vignette,.dh-page.vgh .dh-veil{display:none!important}
.dh-page.vgh .dh-tb{background:rgba(255,255,255,.6)!important;border-bottom:1px solid rgba(255,255,255,.75)!important;box-shadow:0 6px 18px rgba(30,45,34,.06)!important}
.dh-page.vgh .dh-logo span:nth-child(1){color:#1a1a17!important}.dh-page.vgh .dh-logo span:nth-child(2){color:#2b5c3f!important}.dh-page.vgh .dh-logo span:nth-child(3){color:#7a7668!important}
.dh-page.vgh .dh-ver{color:#7a7668!important;border-color:rgba(30,45,34,.15)!important;background:transparent!important}
.dh-page.vgh .dh-pill{background:rgba(255,255,255,.7)!important;color:#3d4a40!important;border-color:rgba(30,45,34,.14)!important}
.dh-page.vgh .dh-pill select,.dh-page.vgh .dh-season-lbl{color:#1a1a17!important}
.dh-page.vgh .dh-eyebrow{color:#7a5f22!important}.dh-page.vgh .dh-eyebrow-line{background:linear-gradient(90deg,#c9a96a,transparent)!important}
.dh-page.vgh .dh-headline{color:#1a1a17!important;text-shadow:none!important}
.dh-page.vgh .dh-accent{background:linear-gradient(120deg,#2b5c3f,#6a4fb0)!important;-webkit-background-clip:text!important;background-clip:text!important;-webkit-text-fill-color:transparent!important}
.dh-page.vgh .dh-tile{background:rgba(255,255,255,.62)!important;border:1px solid rgba(255,255,255,.85)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 10px 28px rgba(30,45,34,.10)!important;-webkit-backdrop-filter:blur(14px)!important;backdrop-filter:blur(14px)!important;animation:none!important;opacity:1!important}
.dh-page.vgh .dh-tile:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 18px 40px rgba(30,45,34,.16)!important;border-color:rgba(142,203,164,.8)!important}
.dh-page.vgh .dh-tile *{text-shadow:none!important}
.dh-err{position:relative;z-index:6;display:flex;align-items:center;gap:12px;flex-wrap:wrap;max-width:940px;margin:0 0 14px;padding:10px 14px;border-radius:12px;background:rgba(176,48,48,.12);border:1px solid rgba(176,48,48,.35);color:#f4d6d6;font-size:13px}
.dh-err button{border:0;border-radius:999px;padding:5px 12px;font:600 12px var(--font-body);background:#fff;color:#8a2a2a;cursor:pointer}
.dh-page.vgh .dh-err{background:rgba(255,255,255,.75);color:#8a2a2a;border-color:rgba(176,48,48,.35)}
.dh-none{grid-column:1/-1;grid-row:1/-1;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:28px;border-radius:20px;background:rgba(255,255,255,.06);border:1px dashed rgba(255,255,255,.2);color:#f4f1e8}
.dh-none span{opacity:.7;font-size:13px}
.dh-page.vgh .dh-none{background:rgba(255,255,255,.55);border-color:rgba(30,45,34,.18);color:#1a1a17}
.dh-page.vgh .dh-primary{background:rgba(232,245,236,.85)!important;border-color:rgba(142,203,164,.7)!important}
.dh-page.vgh .dh-title,.dh-page.vgh .dh-big{color:#1a1a17!important}.dh-page.vgh .dh-big small{color:#2b5c3f!important}
.dh-page.vgh .dh-hint{color:#6a675d!important}.dh-page.vgh .dh-icon{color:#2b5c3f!important}
.dh-page.vgh .dh-eyebrow-t{filter:brightness(.55) saturate(1.6)}.dh-page.vgh .dh-glow,.dh-page.vgh .dh-sheen{opacity:.2!important}
.dh-page.vgh .dh-hero,.dh-page.vgh .dh-ribbon{animation:none;opacity:1}
.dh-page.vgh .dh-ribbon{background:transparent!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;gap:8px}
.dh-page.vgh .dh-ri{background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.85)!important;border-radius:12px;padding:8px 14px!important;box-shadow:0 6px 16px rgba(30,45,34,.06)}
.dh-page.vgh .dh-ri,.dh-page.vgh .dh-ri *,.dh-page.vgh .dh-rtime{color:#4a4840!important}.dh-page.vgh .dh-rv{color:#1a1a17!important}.dh-page.vgh .dh-gold{color:#9a7a3a!important}
/* Home ⇄ module morph */
#vmx{position:fixed;inset:0;z-index:9000;pointer-events:none}
#vmx .vmx-box{position:fixed;box-sizing:border-box;border:1px solid transparent}
.vmx-gh{visibility:hidden!important;transition:none!important}
.vmx-noact{background:transparent!important;box-shadow:none!important}
html.vmx-hold .layout .main,html.vmx-hold .layout .sidebar>*,html.vmx-hold .mobile-nav,html.vmx-hold .menu-btn{opacity:0}
html.vmx-hold .layout.lg-layout .sidebar{background:transparent!important;box-shadow:none!important;border-color:transparent!important}
html.vmx-hold-home .dh-page.vgh>*:not(style){opacity:0}
@media(min-width:768px){
  .lg-layout .sidebar{margin:10px 0 10px 10px;height:calc(100vh - 20px);border-radius:18px;background:rgba(24,38,28,.9);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);border:1px solid rgba(255,255,255,.12);box-shadow:0 12px 32px rgba(30,45,34,.18)}
  .lg-layout .sidebar-logo{border-bottom-color:rgba(255,255,255,.08)}
  .lg-layout .nav-item{border-radius:10px}
  .lg-layout .nav-item.active{background:rgba(255,255,255,.16);box-shadow:0 1px 0 rgba(255,255,255,.18) inset}
}
.lg-panel{background:rgba(255,255,255,.58);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid rgba(255,255,255,.75);box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 8px 24px rgba(30,45,34,.10);border-radius:18px}
button.lg-panel{font-family:var(--font-body);color:var(--text);cursor:pointer;text-align:left;transition:background .2s,transform .2s,box-shadow .2s}
button.lg-panel:hover{background:rgba(255,255,255,.80);transform:translateY(-1px);box-shadow:0 1px 0 rgba(255,255,255,.95) inset,0 12px 30px rgba(30,45,34,.14)}
button.lg-panel:focus-visible,.lg-stp button:focus-visible,.lg-back:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.lg-wrap{width:100%;max-width:720px;margin:0 auto 32px;padding:0 16px;display:flex;flex-direction:column;gap:12px}
.lg-note{font-size:12px;color:var(--text3)}
.lg-resume{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 16px;background:linear-gradient(135deg,rgba(232,245,236,.78),rgba(255,255,255,.5))}
.lg-rk{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.lg-rp{font-size:14px;font-weight:600;flex:1;min-width:180px}
.lg-rp i{font-style:normal;color:var(--text3);margin:0 5px}
.lg-rgo{font-size:13px;font-weight:600;color:var(--accent)}
.lg-stp{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.lg-stp li>span,.lg-stp li>button{width:100%;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:14px;font-family:var(--font-body);text-align:left;color:var(--text3);background:rgba(255,255,255,.38);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.55)}
.lg-stp li.done>button{background:rgba(232,245,236,.72);border-color:rgba(142,203,164,.7);color:var(--text);cursor:pointer}
.lg-stp li.cur>span{background:rgba(255,255,255,.82);color:var(--text);box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 6px 16px rgba(30,45,34,.08)}
.lg-sn{width:22px;height:22px;border-radius:50%;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:var(--bg2);color:var(--text3)}
.lg-stp li.done .lg-sn{background:var(--accent);color:#fff}
.lg-stp li.cur .lg-sn{background:#fff;border:2px solid var(--accent2);color:var(--accent)}
.lg-sl{display:flex;flex-direction:column;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;line-height:1.2;min-width:0}
.lg-sl small{font-size:12px;text-transform:none;letter-spacing:0;font-weight:500;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg-chg{margin-left:auto;font-size:11px;font-weight:600;color:var(--accent);border:1px solid #8ecba4;border-radius:20px;padding:2px 9px;background:rgba(255,255,255,.75)}
.lg-back{align-self:flex-start;font-family:var(--font-body);font-size:13px;font-weight:500;color:var(--text2);background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.7);border-radius:20px;padding:4px 12px;cursor:pointer;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.lg-back:hover{color:var(--accent)}
.lg-g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lg-g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.lg-fade{animation:lgfade .15s ease}
@keyframes lgfade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.lg-line{display:flex;align-items:center;gap:14px;padding:18px}
.lg-line.idle{opacity:.65}
.lg-orchards{--lc:#2b5c3f}.lg-pivots{--lc:#8a6a2e}
.lg-ic{color:var(--lc);flex-shrink:0;width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.6);box-shadow:0 1px 0 #fff inset;display:flex;align-items:center;justify-content:center}
.lg-lt{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.lg-nm{font-family:var(--font-display);font-size:22px;line-height:1.1}
.lg-ar{font-family:var(--font-body);font-size:13px;color:var(--text3);direction:rtl;unicode-bidi:isolate}
.lg-ls{display:grid;grid-template-columns:auto auto;gap:0 6px;align-items:baseline;text-align:right}
.lg-ls b{font-family:var(--font-mono);font-size:15px}.lg-ls small{font-size:10px;color:var(--text3);text-align:left}
.lg-ph{display:flex;flex-direction:column;gap:7px;padding:12px 14px}
.lg-top{display:flex;align-items:center;gap:10px}
.lg-ini{width:34px;height:34px;flex-shrink:0;border-radius:11px;background:color-mix(in srgb,var(--pc) 16%,rgba(255,255,255,.5));color:var(--pc);display:inline-flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:12px;font-weight:600}
.lg-phn{font-weight:600;font-size:14px;line-height:1.2;flex:1;min-width:0}
.lg-cnt{font-family:var(--font-mono);font-size:15px;font-weight:600;color:var(--pc)}
.lg-ph.idle{opacity:.6}.lg-ph.idle .lg-cnt{color:var(--text3)}
.lg-chips{display:flex;flex-wrap:wrap;gap:4px}
.lg-cp{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:500;color:var(--cc);background:color-mix(in srgb,var(--cc) 12%,rgba(255,255,255,.55));border:1px solid rgba(255,255,255,.7)}
.lg-hint{font-size:11px;color:var(--text3)}
.lg-crop{display:flex;flex-direction:column;gap:2px;padding:14px 16px}
.lg-ctop{display:flex;align-items:center;gap:8px}

/* APP LAYOUT */
.layout{display:flex;height:100vh;overflow:hidden}

.nav-item:hover{background:var(--sidebar2);color:#fff}

.sidebar-bottom{margin-top:auto;padding:7px 8px 6px;border-top:1px solid rgba(255,255,255,.06)}

.side-ws svg{width:15px;height:15px;opacity:.8;flex-shrink:0}
.side-look{display:inline-flex;align-items:center;gap:4px;padding:0;background:none;border:0;color:var(--sidebar-text);opacity:.8;font:500 10px var(--font-body);cursor:pointer;white-space:nowrap;text-decoration:underline dotted;text-underline-offset:3px}

.main{flex:1;overflow-y:auto;display:flex;flex-direction:column;min-width:0}

/* COMPONENTS */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:14px 16px}

.kpi-label{font-size:11px;color:var(--text3);margin-bottom:4px;font-weight:500}

.badge-warn{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border)}
.badge-fail{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
.badge-hold{background:#fff3e0;color:#b06010;border:1px solid #e8c090}
.badge-escalated{background:#e8eeff;color:#2a50c0;border:1px solid #a0b4e8;font-weight:600}
.badge-special-accept{background:#f0e8ff;color:#6a10b0;border:1px solid #c090e0;font-weight:600}
.badge-special-reject{background:#fff0e8;color:#b04010;border:1px solid #e0b090;font-weight:600}
.badge-neutral{background:var(--bg2);color:var(--text2);border:1px solid var(--border)}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;min-width:600px}
th{text-align:left;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text3);padding:7px 10px;border-bottom:2px solid var(--border2);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text2);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--bg)}
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--border);margin-bottom:18px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{padding:7px 14px;font-size:13px;font-weight:500;color:var(--text3);border-bottom:2px solid transparent;margin-bottom:-2px;cursor:pointer;transition:color .15s,border-color .15s;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:var(--r);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;border:1px solid transparent;white-space:nowrap}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:var(--accent2)}
.btn-secondary{background:var(--card);color:var(--text2);border-color:var(--border2)}
.btn-secondary:hover{background:var(--bg2)}
.btn-sm{padding:4px 10px;font-size:12px}
.scroll-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);overflow:visible}.scroll-card .table-wrap{overflow-x:auto;overflow-y:visible;border-radius:var(--r2)}
.scroll-card .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.lot{font-family:var(--font-mono);font-size:11px;background:var(--bg2);padding:2px 6px;border-radius:4px;color:var(--text2)}
.sep{height:1px;background:var(--border);margin:12px 0}
.alert-warn{background:#fff3e0;border:1px solid #e8c090;border-radius:6px;padding:8px 12px;margin-bottom:12px;font-size:12px;color:#7a4a10}
.alert-fail{background:var(--red-bg);border:1px solid var(--red-border);border-radius:6px;padding:8px 12px;margin-bottom:12px;font-size:12px;color:var(--red)}
.dp{border:1px solid var(--border);border-radius:var(--r2);overflow:hidden}
.dp-hdr{background:var(--bg2);padding:11px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
/* Mobile bottom sheet */
@media(max-width:700px){
  .dp-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:300;display:flex;flex-direction:column;justify-content:flex-end;touch-action:none}
  .dp-sheet{background:var(--card);border-radius:20px 20px 0 0;max-height:82vh;display:flex;flex-direction:column;transition:transform .28s cubic-bezier(.32,.72,0,1);transform:translateY(0)}
  .dp-handle-wrap{padding:10px 0 4px;display:flex;justify-content:center;cursor:grab;flex-shrink:0}
  .dp-handle{width:36px;height:4px;background:var(--border2);border-radius:2px}
  .dp-sheet .dp-hdr{border-radius:0;flex-shrink:0}
  .dp-sheet .dp-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;max-height:none}
  .dp-sheet-actions{padding:12px 16px 28px;border-top:1px solid var(--border);background:var(--card);flex-shrink:0;display:flex;gap:8px}
}
.dp-body{padding:14px;font-size:13px;max-height:calc(100vh - 120px);overflow-y:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}

/* INSPECTION FORM */
.form-field{margin-bottom:10px}
.form-label{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;display:block}
/* Locked inspection header: children stay non-interactive, but the wrapper itself
   receives the click so we can tell the inspector why nothing happened. Previously
   the whole block was pointerEvents:none, so an edit attempt was silently lost. */
.hdr-locked{pointer-events:auto!important;cursor:not-allowed}
.hdr-locked *{pointer-events:none!important}
.form-input{width:100%;padding:8px 10px;border:1px solid var(--border2);border-radius:6px;background:var(--card);outline:none;transition:border-color .15s;font-size:14px;color:var(--text)}
.form-input:focus{border-color:var(--accent)}
.form-select{width:100%;padding:8px 10px;border:1px solid var(--border2);border-radius:6px;background:var(--card);outline:none;font-size:14px;color:var(--text)}
.defect-section{margin-bottom:16px}
.defect-section-header{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;border-radius:5px;margin-bottom:8px}
.defect-row{display:grid;grid-template-columns:1fr 90px 55px 60px;gap:6px;align-items:center;padding:5px 0;border-bottom:1px solid var(--border)}
.defect-row:last-child{border-bottom:none}
.defect-input{width:100%;padding:4px 7px;border:1px solid var(--border2);border-radius:4px;background:var(--card);font-family:var(--font-mono);font-size:12px;text-align:right;outline:none}
.defect-input:focus{border-color:var(--accent)}
.defect-input.over{border-color:var(--red);background:var(--red-bg);color:var(--red)}
.defect-thresh{font-size:10px;color:var(--text3);text-align:right}
.total-row{display:grid;grid-template-columns:1fr 90px 55px 60px;gap:6px;align-items:center;padding:8px 10px;background:var(--bg2);border-radius:6px;margin-top:8px}
.total-label{font-size:12px;font-weight:600;color:var(--text)}
.total-val{font-family:var(--font-mono);font-size:14px;font-weight:600;text-align:right}
.clearance-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.clearance-item{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:var(--bg2);border-radius:6px;font-size:11px}
.clearance-label{color:var(--text2);flex:1;margin-right:8px}
.toggle-wrap{display:flex;gap:4px}
.toggle-btn{padding:4px 10px;border-radius:4px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid var(--border2);background:var(--card);color:var(--text3);transition:all .12s}
.toggle-btn.active-comply{background:var(--green-bg);color:var(--green);border-color:var(--green-border)}
.toggle-btn.active-non{background:var(--red-bg);color:var(--red);border-color:var(--red-border)}
.decision-bar{display:flex;gap:8px;margin-top:14px}
.decision-btn{flex:1;padding:10px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:2px solid transparent;transition:all .15s;text-align:center}
.decision-a{background:var(--green-bg);color:var(--green);border-color:var(--green-border)}
.decision-a:hover,.decision-a.sel{background:var(--green);color:#fff;border-color:var(--green)}
.decision-r{background:var(--red-bg);color:var(--red);border-color:var(--red-border)}
.decision-r:hover,.decision-r.sel{background:var(--red);color:#fff;border-color:var(--red)}
.wax-options{display:flex;gap:6px;flex-wrap:nowrap}
.wax-btn{padding:6px 14px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border2);background:var(--card);color:var(--text3);transition:all .12s}
.wax-btn.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.currency-wrap{display:flex;gap:6px;align-items:center}
.currency-select{width:76px;flex-shrink:0;padding:8px 6px;border:1px solid var(--border2);border-radius:6px;background:var(--card);outline:none;font-size:13px;color:var(--text)}
.currency-select:focus{border-color:var(--accent)}

/* ── RESPONSIVE BREAKPOINTS ── */

/* Tablet: 768px–1024px */
@media(max-width:1024px){
  :root{--sidebar-w:190px}
  .page{padding:14px}
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .topbar-title{font-size:15px}
  .kpi-value{font-size:22px}
}

/* Mobile: up to 767px */
/* CQC listing responsive */
.cqc-list-row{display:flex;gap:12px;align-items:flex-start}
.cqc-list-pane{flex:1;min-width:0;transition:flex .2s}
.cqc-list-pane.has-detail{flex:0 0 42%}
.cqc-detail-pane{flex:1;min-width:0;position:sticky;top:16px;max-height:calc(100vh - 80px);overflow-y:auto}
.cqc-stat-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-bottom:16px}.cqc-kpi{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 12px;position:relative;overflow:hidden;transition:box-shadow .15s}.cqc-kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:8px 0 0 8px}
.cqc-two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.cqc-two-col-bot{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cqc-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.cqc-filters{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:1px}
.cqc-filters::-webkit-scrollbar{display:none}
@media(max-width:900px){
  .cqc-list-pane.has-detail{flex:1}
  .cqc-detail-pane{display:none}
  .cqc-stat-grid{grid-template-columns:repeat(3,1fr)}
  .cqc-two-col,.cqc-two-col-bot{grid-template-columns:1fr}
}
@media(max-width:767px){
  .cqc-stat-grid{grid-template-columns:repeat(3,1fr)}
  .cqc-toolbar{flex-wrap:nowrap;gap:6px}
  .cqc-th-hide{display:none!important}
  .cqc-td-hide{display:none!important}
}
@media(max-width:767px){
  /* Sidebar becomes slide-in drawer */
  .sidebar{position:fixed;top:0;left:0;bottom:0;z-index:41;transform:translateX(-100%);width:240px!important;min-width:0!important}
  .sidebar.open{transform:translateX(0)}
  .sidebar-overlay.open{display:block}
  .mobile-nav{display:none!important}
  .menu-btn{display:flex}
  /* No bottom nav — no bottom padding needed */
  .layout{flex-direction:column;height:auto;min-height:100vh}
  .main{padding-bottom:0}
  /* Page padding */
  .page{padding:12px}
  /* Topbar */
  .topbar{padding:0 12px;height:48px}
  .topbar-title{font-size:15px}
  /* KPIs — 2 columns on mobile */
  .kpi-grid{grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
  .kpi{padding:10px 12px}
  .kpi-value{font-size:20px}
  .kpi-sub{font-size:10px}
  /* Grids — single column */
  .grid4{grid-template-columns:1fr}
  .grid3{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
  /* Cards */
  .card{padding:12px}
  /* Detail panel — full width */
  .dp{margin-top:12px}
  .dp-body{max-height:none}
  /* Clearance grid */
  .clearance-grid{grid-template-columns:1fr}
  .clearance-item{flex-wrap:wrap;gap:6px}
  /* Decision bar */
  .decision-bar{flex-direction:column}
  /* Tabs scroll */
  .tabs{overflow-x:auto}
  .tab{padding:6px 12px;font-size:12px}
  /* Buttons */
  .btn{padding:8px 12px;font-size:13px}
  .btn-sm{padding:6px 10px;font-size:12px}
  /* Landing packhouses */
  .ph-grid{grid-template-columns:1fr!important}
  /* Sample rows — horizontal scroll */
  .sample-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
}

/* Very small phones */
@media(max-width:380px){
  .kpi-grid{grid-template-columns:1fr}
  .topbar-title{font-size:14px}
}

/* ── MOBILE — INSPECTION FORM & GLOBAL ── */

/* Prevent iOS font zoom on inputs — must be 16px */
input,select,textarea{font-size:16px!important}
@media(min-width:768px){
  input,select,textarea{font-size:14px!important}
  .form-input{font-size:14px!important}
  .form-select{font-size:14px!important}
}

@media(max-width:767px){
  /* ── Sidebar — scrollable, sidebar-bottom always visible ── */
  .sidebar{overflow-y:auto!important;display:flex!important;flex-direction:column!important}
  .sidebar-bottom{flex-shrink:0}

  /* ── Form topbar — two clean rows ── */
  .sticker-grid{grid-template-columns:1fr!important}
  .topbar-badge{display:none}
  .form-topbar{flex-wrap:nowrap!important;height:auto!important;padding:8px 10px!important;gap:6px;align-items:center!important}
  .form-topbar-left-group{flex:1;min-width:0;display:flex;align-items:center;gap:6px;overflow:hidden}
  .form-topbar-title{font-size:14px!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .form-topbar-right{flex-shrink:0;display:flex!important;align-items:center;gap:6px}
  .form-topbar-right .btn-primary{min-height:38px;padding:6px 14px!important;font-size:13px!important}
  .form-topbar-avg{font-size:13px!important;font-weight:700;white-space:nowrap}
  .form-topbar-newpallet{display:none!important}
  .inspection-page{padding:10px 8px!important}

  /* ── Form inputs — bigger tap targets ── */
  .form-input{padding:11px 12px!important;font-size:16px!important;min-height:44px}
  .form-select{padding:11px 12px!important;font-size:16px!important;min-height:44px}
  .form-label{font-size:11px!important;margin-bottom:5px}

  /* ── Wax buttons ── */
  .wax-btn{padding:10px 12px!important;font-size:13px!important;min-height:44px;flex-shrink:0}
  .wax-options{flex-wrap:nowrap!important;gap:6px!important;overflow-x:auto!important;-webkit-overflow-scrolling:touch!important;padding-bottom:2px}

  /* ── Decision buttons ── */
  .decision-btn{padding:16px 12px!important;font-size:15px!important}

  /* ── Toggle / clearance buttons ── */
  .toggle-btn{padding:10px 14px!important;font-size:13px!important;min-height:40px}
  .clearance-item{flex-direction:column!important;align-items:flex-start!important;gap:8px!important;padding:10px 12px!important}
  .clearance-btns{display:flex;gap:8px;width:100%}
  .clearance-btns .toggle-btn{flex:1;text-align:center}

  /* ── Pallet header ── */
  .pallet-header-actions{flex-wrap:wrap;gap:6px}
  .clearance-grid{grid-template-columns:1fr!important}

  /* ── Sample cards vs table ── */
  .sample-table-desktop{display:none!important}
  .sample-card-mobile{display:block!important}
.grapes-row-stripe{background:rgba(0,0,0,.015);}
.grapes-row-crit{background:#fff8f8;}

  /* ── Defect expanded grid — single column on phones, 2 col on tablet ── */
  .defect-expand-grid{grid-template-columns:1fr!important}
  .defect-name-cell{min-width:0;overflow:hidden}
  .defect-name-cell .defect-en{font-size:11px!important;line-height:1.3;white-space:normal;word-break:break-word}
  .defect-row-input{width:56px!important;padding:5px 4px!important;font-size:14px!important;min-height:38px}

  /* ── Cards ── */
  .card{padding:12px!important}
  .section-title{font-size:12px}

  /* ── Buttons ── */
  .btn{min-height:40px}
  .btn-sm{min-height:38px;padding:7px 12px!important;font-size:13px!important}
  .btn-primary{min-height:44px}

  /* ── New pallet modal — slide up ── */
  .new-pallet-modal{width:100%!important;max-width:100%!important;border-radius:16px 16px 0 0!important;position:fixed!important;bottom:0!important;left:0!important;right:0!important;padding:24px 20px 36px!important}

  /* ── Landing — KPI 2 col, packhouse 1 col ── */
  .landing-kpi-grid{grid-template-columns:1fr 1fr!important}
  .landing-ph-grid{grid-template-columns:1fr!important;gap:8px!important}
  .landing-crop-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px!important}
  .crop-card{padding:14px 12px!important}

  /* ── Batch list table ── */
  .scroll-card{border-radius:8px!important}
}

/* Tablet 480–767px */
@media(min-width:480px) and (max-width:767px){
  .sample-card-mobile .sample-card-grid{grid-template-columns:1fr 1fr!important}
  .defect-expand-grid{grid-template-columns:1fr 1fr!important}
  .landing-ph-grid{grid-template-columns:1fr 1fr!important;gap:10px!important}
  .landing-crop-grid{grid-template-columns:repeat(3,1fr)!important}
}

/* Very small phones ≤ 380px */
@media(max-width:380px){
  .landing-kpi-grid{grid-template-columns:1fr 1fr!important}
  .topbar-title{font-size:14px}
  .inspection-page{padding:8px 6px!important}
  .card{padding:10px!important}
  .defect-expand-grid{grid-template-columns:1fr!important}
  .landing-crop-grid{grid-template-columns:1fr 1fr!important}
  .toggle-btn{padding:9px 10px!important;font-size:12px!important}
}

/* Desktop — show table hide cards */
@media(min-width:768px){
  .sample-table-desktop{display:block!important}
  .sample-card-mobile{display:none!important}
  .form-topbar-newpallet{display:inline-flex!important}
}
/* ── Grape loader ── */
@keyframes gp0{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.84)}}
@keyframes gp1{0%,100%{opacity:.9;transform:scale(1)}50%{opacity:.4;transform:scale(.84)}}
@keyframes gp2{0%,100%{opacity:.8;transform:scale(1)}50%{opacity:.35;transform:scale(.84)}}
@keyframes gp3{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:.3;transform:scale(.84)}}
@keyframes gp4{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:.25;transform:scale(.84)}}
@keyframes gp5{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:.2;transform:scale(.84)}}
@keyframes gp6{0%,100%{opacity:.38;transform:scale(1)}50%{opacity:.15;transform:scale(.84)}}
@keyframes gpdots{0%{content:''}25%{content:'.'}50%{content:'..'}75%,100%{content:'...'}}
@keyframes dalos-pulse{0%,100%{opacity:.4}50%{opacity:.85}}
@keyframes dalos-spin{to{transform:rotate(360deg)}}
@keyframes dalos-flash{0%,100%{box-shadow:0 0 0 3px rgba(176,48,48,.35),0 0 18px rgba(176,48,48,.45)}50%{box-shadow:0 0 0 6px rgba(176,48,48,.55),0 0 24px rgba(176,48,48,.6)}}
@keyframes dalos-pallet-slide-out{0%{transform:translateX(0) scale(1);opacity:1}100%{transform:translateX(120px) scale(0.94);opacity:0}}
@media(prefers-reduced-motion:reduce){@keyframes dalos-pallet-slide-out{0%,100%{opacity:1}}}
.dalos-spinner{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:dalos-spin .8s linear infinite;vertical-align:middle}
@keyframes cqc-shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.cqc-shim{display:inline-block;border-radius:5px;background:linear-gradient(90deg,rgba(0,0,0,.05),rgba(0,0,0,.12),rgba(0,0,0,.05));background-size:200% 100%;animation:cqc-shimmer 1.2s ease-in-out infinite;vertical-align:middle}
.dalos-field-error{outline:none!important;border-color:#b03030!important;animation:dalos-flash 1.4s ease-in-out 2;background:rgba(176,48,48,.06)!important}
.dalos-field-error-wrap{border-radius:8px;padding:4px;margin:-4px;animation:dalos-flash 1.4s ease-in-out 2;background:rgba(176,48,48,.06)}
.grape-dots::after{content:'';animation:gpdots 1.2s steps(1) infinite}
@media (prefers-reduced-motion:reduce){.vl-anim{animation:none!important}.grape-dots::after{animation:none;content:'\2026'}}
/* ── Tooltip handled via JS fixed overlay ── */
.cqc-grid{border-collapse:collapse;width:100%;font-size:12px;table-layout:fixed;}
.cqc-grid-outer{overflow-x:auto;border:1px solid var(--border);border-radius:6px;}
.cqc-grid-head{overflow-x:auto;overflow-y:hidden;border-bottom:2px solid var(--border);scrollbar-width:none;}.cqc-grid-head::-webkit-scrollbar{display:none;}
.cqc-grid-head .cqc-grid{border-bottom:none;}
.cqc-grid-body{overflow-y:auto;max-height:55vh;}
.cqc-grid-head .cqc-grid td,.cqc-grid-head .cqc-grid th{border-top:none;}
.cqc-grid-body .cqc-grid thead{display:none;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.5;transform:scale(1.3);}}
/* God-mode login */
@keyframes dlogin-aurora{0%{transform:translate(0,0) scale(1)}33%{transform:translate(4%,-3%) scale(1.08)}66%{transform:translate(-3%,4%) scale(.96)}100%{transform:translate(0,0) scale(1)}}
@keyframes dlogin-cardin{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes dlogin-cardout{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(-10px) scale(.94)}}
@keyframes dlogin-welcome{0%{opacity:0;transform:translateY(14px) scale(.96)}22%{opacity:1;transform:translateY(0) scale(1)}80%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-8px) scale(1.02)}}

.dlogin{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;overflow:hidden;background:transparent;color:#eef0ea;}
.dlogin>*{position:relative;z-index:5;}
.dlogin-crest{position:absolute;right:-60px;top:50%;transform:translateY(-50%);width:min(42vw,520px);height:min(42vw,520px);z-index:1;opacity:.8;pointer-events:none}

<body>
<div id="root"></div>
<!-- Entry splash: shows instantly (before React/fonts/supabase), fades out once the app shell paints. Matches the Workspace redirect splash so launch is one continuous animation. -->
<div id="vision-splash">
  <svg class="vs-anim" width="60" height="60" viewBox="0 0 48 48" fill="none" aria-label="DalOS Vision">
    <circle class="vs-ring" cx="24" cy="24" r="17" stroke="#4a8c62" stroke-width="1.4"/>
    <g fill="#8fe0ad"><circle class="vs-grape" cx="24" cy="17" r="3.1"/><circle class="vs-grape" cx="19" cy="22" r="3.1"/><circle class="vs-grape" cx="29" cy="22" r="3.1"/><circle class="vs-grape" cx="21.5" cy="27" r="3.1"/><circle class="vs-grape" cx="26.5" cy="27" r="3.1"/><circle class="vs-grape" cx="24" cy="32" r="3.1"/></g>
    <path d="M24 14 V11 Q27 10 29 12" stroke="#6fc191" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  </svg>
  <div class="vs-word"><span style="color:#f4f1e8">Dal</span><span style="color:#6fc191">OS</span><span style="color:#f4f1e8"> Vision</span></div>
  <div class="vs-sub">Loading…</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>

<script>
/* Config that differs between staging and prod lives HERE, not in vision.js (vision.js is identical on both). */
/* User-visible version shown under "Sign out" in the sidebar. Bump on each user-facing release. */
var DALOS_BUILD='v1.7'/*BUILD*/;var DALOS_BUILD_INFO=''/*BUILD_INFO*/; /* stamped on deploy by .github/workflows/pages.yml: v1.7 → v1.7.<build>, info = commit · Cairo time. Raise the base version here for a release. */
/* Per-browser switches for the new UI. On the staging copy (dalos-vision-dev, localhost) every new look is ON unless a browser
   opts out; on prod it stays OFF unless a browser opts in — until VISION_DEFAULT_ON is set to true there. A ?param is saved
   for this browser and then removed from the address, so the in-app toggle is never pinned by an old link. */
var VISION_IS_DEV=/\/dalos-vision-dev\//.test(location.pathname)||/^(localhost|127\.0\.0\.1)$/.test(location.hostname);
var VISION_DEFAULT_ON=VISION_IS_DEV;
</script>
<script src="vision.js?v=9603d5e206"></script>
<script>
/* Fade the entry splash once the app shell first paints (React commits to #root),
   with a hard fallback so it can never stick. */
(function(){
  var sp=document.getElementById('vision-splash'); if(!sp) return;
  var done=false;
  function clear(){ if(done) return; done=true; sp.style.opacity='0'; setTimeout(function(){ if(sp.parentNode) sp.parentNode.removeChild(sp); },480); }
  var root=document.getElementById('root');
  if(root && window.MutationObserver){
    if(root.childNodes.length){ setTimeout(clear,180); }
    else { var mo=new MutationObserver(function(){ if(root.childNodes.length){ mo.disconnect(); setTimeout(clear,180); } }); mo.observe(root,{childList:true}); }
  } else { setTimeout(clear,600); }
  setTimeout(clear,4000);
})();
</script>
<script>
(function(){
  if(window.__dalosSwitcher) return; window.__dalosSwitcher=1;
  /* Temporarily hidden — the app switch moved to a Workspace button in the sidebar
     (same style as Land Cloud). Flip to true to restore the floating FAB switcher. */
  var SWITCHER_ENABLED_IN_VISION = false;
  if(!SWITCHER_ENABLED_IN_VISION) return;
  function build(){
    if(!document.body || document.getElementById('dalos-switcher')) return;
    var isDev = location.pathname.indexOf('/dalos-vision-dev/')===0;
    var WS = isDev ? 'https://daltexcorp-opsexcellence.github.io/dalos-workspace-dev/' : 'https://daloshq.com/workspace/workspace.html';
    var ANALYTICS = isDev ? 'https://daltexcorp-opsexcellence.github.io/dalos-analytics-dev/' : 'https://daloshq.com/analytics/';
    var APPS = '<svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/><path d="M17 4v6M14 7h6"/></svg>';
    var APPS_S = '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/><path d="M17 4v6M14 7h6"/></svg>';
    var CHART = '<svg viewBox="0 0 48 48" width="20" height="20"><g fill="currentColor"><rect x="8" y="27" width="7" height="13" rx="2"/><rect x="20" y="21" width="7" height="19" rx="2"/><rect x="32" y="14" width="7" height="26" rx="2"/></g><path d="M9 19 L20 14 L31 9 L40 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M34 5 L40 5 L40 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    var LOCK = '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
    var st = document.createElement('style');
    st.textContent = '.dsw{position:fixed;right:20px;bottom:64px;z-index:2147483000;display:flex;flex-direction:column;align-items:flex-end;gap:8px;font-family:inherit}'
      + '.dsw-menu{display:flex;flex-direction:column;align-items:flex-end;gap:8px;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .18s ease,transform .18s ease}'
      + '.dsw:hover .dsw-menu,.dsw.open .dsw-menu,.dsw:focus-within .dsw-menu{opacity:1;transform:none;pointer-events:auto}'
      + '.dsw-anchor{width:46px;height:46px;border-radius:50%;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;background:#d9b25f;color:#3a2c0e;box-shadow:0 2px 10px rgba(0,0,0,.30)}'
      + '.dsw-item{position:relative;display:inline-flex;align-items:center;gap:9px;height:38px;padding:0 10px 0 14px;border-radius:19px;font-size:13px;font-weight:500;cursor:pointer;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.22);flex-direction:row-reverse;white-space:nowrap;background:#1c3a2b;color:#e8d7a8;border:1px solid #2f5740}'
      + '.dsw-item .dsw-ic{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px}'
      + '.dsw-locked{background:#16281f;color:#7f9788;border-color:#24402f}'
      + '.dsw-lock{position:absolute;left:-6px;top:-6px;width:18px;height:18px;border-radius:50%;background:#3a4b40;color:#cfe0d4;display:inline-flex;align-items:center;justify-content:center;border:1px solid #24402f}';
    document.head.appendChild(st);
    var wrap = document.createElement('div'); wrap.className='dsw'; wrap.id='dalos-switcher';
    wrap.innerHTML =
      '<div class="dsw-menu" role="menu">'
      + '<a class="dsw-item dsw-ana dsw-locked" id="dsw-ana" role="menuitem" tabindex="0"><span class="dsw-lock" id="dsw-lock">'+LOCK+'</span><span class="dsw-ic">'+CHART+'</span><span>DalOS Analytics</span></a>'
      + '<a class="dsw-item" role="menuitem" tabindex="0" href="'+WS+'"><span class="dsw-ic">'+APPS_S+'</span><span>Workspace</span></a>'
      + '</div>'
      + '<button class="dsw-anchor" aria-label="Open app switcher" aria-expanded="false">'+APPS+'</button>';
    document.body.appendChild(wrap);
    var anchor = wrap.querySelector('.dsw-anchor');
    anchor.addEventListener('click', function(e){ e.stopPropagation(); var o=wrap.classList.toggle('open'); anchor.setAttribute('aria-expanded', o?'true':'false'); });
    document.addEventListener('click', function(){ wrap.classList.remove('open'); anchor.setAttribute('aria-expanded','false'); });
    var ana = wrap.querySelector('#dsw-ana');
    ana.addEventListener('click', function(e){ e.preventDefault(); location.href = (ana.getAttribute('data-granted')==='1') ? ANALYTICS : WS; });
    function unlockAnalytics(){ ana.classList.remove('dsw-locked'); ana.setAttribute('data-granted','1'); var lk=document.getElementById('dsw-lock'); if(lk) lk.remove(); }
    function checkAccess(tries){
      try{
        // Wait for the Supabase client to finish loading before doing anything.
        if(typeof supabase==='undefined' || !supabase.rpc){ if(tries>0) setTimeout(function(){checkAccess(tries-1);},1200); return; }
        // Only ever call has_analytics_access with a live user JWT — a call with no
        // valid token lands as anon (no EXECUTE) -> 42501. Wait for the session to
        // hydrate (retry), refresh if expired, and fail closed (leave tile locked)
        // rather than calling the RPC as anon. The RPC result is authoritative, so
        // we never retry it.
        // getSession() already refreshes an expired token internally, under supabase-js's
        // cross-tab lock. The explicit refreshSession() that used to sit here fired whenever
        // the token was within 15s of expiry and added an unserialised refresh that could
        // race other tabs — a rotation conflict there signs the user out of every DalOS app.
        supabase.auth.getSession().then(function(sr){
          var sess=sr&&sr.data&&sr.data.session;
          if(!sess||!sess.access_token){ if(tries>0) setTimeout(function(){checkAccess(tries-1);},1200); return; }
          return supabase.rpc('has_analytics_access').then(function(a){
            if(a && !a.error && a.data===true){ unlockAnalytics(); }
          });
        }).catch(function(){});
      }catch(_e){}
    }
    checkAccess(3);
  }
  if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded', build); } else { build(); }
})();
</script>
