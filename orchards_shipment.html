<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>DalOS Orchards Shipment</title>
<style>
  html,body{margin:0;height:100%;background:#f0ede6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
  .load{height:100%;display:flex;align-items:center;justify-content:center;color:#7a7668;font-size:13px}
  .load .dot{width:9px;height:9px;border-radius:50%;background:#b87820;margin-right:9px;animation:pl 1s infinite}
  @keyframes pl{0%,100%{opacity:.3}50%{opacity:1}}
</style>
<div class="load"><span class="dot"></span> Opening shipments…</div>
<script>
/* Single entry point for the Orchards Shipments page — auto-detects the device
   and opens the phone UI on phones, the desktop UI otherwise. Preserves any
   ?edit=… deep-link + hash. Share THIS link; the two UIs are one tool. */
(function () {
  var ua = navigator.userAgent || '';
  var phone  = /iPhone|iPod|Android.*Mobile|Windows Phone|BlackBerry|Opera Mini|IEMobile/i.test(ua);
  var narrow = window.matchMedia && window.matchMedia('(max-width: 820px)').matches;
  var mobile = phone || narrow;
  var target = (mobile ? 'orchards_shipment_mobile.html' : 'orchards_shipment_desktop.html')
             + location.search + location.hash;
  location.replace(target);
})();
</script>
<noscript>
  <p style="padding:20px;font-size:14px">JavaScript is required.
    <a href="orchards_shipment_desktop.html">Open the desktop shipments page</a> ·
    <a href="orchards_shipment_mobile.html">mobile</a>.</p>
</noscript>
